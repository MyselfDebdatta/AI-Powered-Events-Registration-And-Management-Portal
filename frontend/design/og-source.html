    <style>

        font-weight: 100 900;

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {

      /* Faint column rules */
      body::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image: linear-gradient(to right, rgba(251, 248, 241, 0.05) 1px, transparent 1px);
        background-size: 100px 100%;
        mask-image: linear-gradient(to right, transparent 0, #000 55%, #000 100%);
        -webkit-mask-image: linear-gradient(to right, transparent 0, #000 55%, #000 100%);
      }
      .frame {
        position: absolute;
        inset: 44px;
        border: 1px solid rgba(201, 162, 39, 0.35);
        border-radius: 18px;
        pointer-events: none;
      }

        left: 84px;
        top: 96px;

        left: 84px;
        bottom: 84px;
        display: flex;
        gap: 14px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        height: 44px;
